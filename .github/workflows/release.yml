name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.2.0"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/MapRun-${VERSION}.apk"
          echo "APK_PATH=dist/MapRun-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapRun-apk
          path: dist/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MapRun ${{ env.VERSION }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            Готовый APK для установки на Android 8+.

            ### 1.2.0
            - Цель недели: прогресс на карте, в ленте и на виджете
            - Свежий дизайн карточек, ачивок, статистики и финиша
            - Шаринг текстом из деталей тренировки

            ### 1.1.0
            - Фикс вылета при завершении пробежки (Android 12+)
            - Автосохранение в историю сразу на стопе
            - Экран финиша больше не теряет маршрут
            - Шаринг текстовой сводки

            ### Установка
            1. Скачай `MapRun-${{ env.VERSION }}.apk`
            2. На телефоне разреши установку из неизвестных источников
            3. Открой файл и установи
            4. Дай доступ к геолокации (и уведомлениям на Android 13+)

            Подпись сейчас debug — для своего телефона нормально, в Google Play такой файл не принимают.

            Карте нужен интернет (тайлы OpenFreeMap). Лучше настоящий телефон, не эмулятор.
